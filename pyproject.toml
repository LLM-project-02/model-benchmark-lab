[project]
name = "project2-kit"
version = "0.1.0"
description = "고객 문의 분류와 답변 생성을 단계별 Python 파일로 학습하는 실습 자료"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "transformers>=4.51,<5",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "langchain-core>=0.3.60,<2",
  "openai>=2,<3",
  "matplotlib>=3.10,<4", # 계산한 지표·혼동 행렬의 PNG 저장
  "psutil>=7,<8", # 프로세스 RSS·CPU 측정 환경 기록
  "filelock>=3.18,<5", # 모델 선택·최종 평가의 공통 OS 파일 잠금
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# 새 평가·실험 저장 테스트까지 기존 테스트와 함께 수집한다.
testpaths = ["tests"]
pythonpath = ["steps"]

[tool.ruff]
line-length = 100
target-version = "py312"
